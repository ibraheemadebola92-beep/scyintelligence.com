  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230f172a'/%3E%3Cpath d='M30 62 L50 40 L70 62' stroke='%233b82f6' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='50' cy='70' r='5' fill='%2310b981'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #0f172a;
      --secondary: #3b82f6;
      --secondary-dark: #2563eb;
      --background: #f8fafc;
      --text: #1e293b;
      --accent: #10b981;
      --accent-dark: #059669;
      --white: #ffffff;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-300: #cbd5e1;
      --slate-400: #94a3b8;
      --slate-500: #64748b;
      --slate-600: #475569;
      --slate-700: #334155;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
      --slate-950: #020617;

      --font-display: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', sans-serif;

      --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.04), 0 1px 3px 0 rgba(15, 23, 42, 0.06);
      --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.08), 0 2px 4px -2px rgba(15, 23, 42, 0.06);
      --shadow-lg: 0 10px 20px -3px rgba(15, 23, 42, 0.1), 0 4px 8px -4px rgba(15, 23, 42, 0.06);
      --shadow-xl: 0 20px 40px -8px rgba(15, 23, 42, 0.16), 0 8px 16px -8px rgba(15, 23, 42, 0.08);
      --shadow-glow: 0 0 0 1px rgba(59, 130, 246, 0.15), 0 20px 50px -12px rgba(59, 130, 246, 0.35);

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --radius-2xl: 32px;
      --radius-full: 9999px;

      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.5rem;
      --space-6: 2rem;
      --space-7: 2.5rem;
      --space-8: 3rem;
      --space-9: 4rem;
      --space-10: 5rem;
      --space-11: 6rem;
      --space-12: 8rem;

      --max-width: 1200px;
      --max-width-narrow: 800px;
      --nav-height: 76px;

      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in-out: cubic-bezier(0.45, 0, 0.55, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
      scroll-padding-top: calc(var(--nav-height) + 20px);
    }

    body {
      font-family: var(--font-body);
      background-color: var(--background);
      color: var(--text);
      line-height: 1.6;
      font-size: 16px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
    }

    /* Ambient background */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(60% 50% at 15% 10%, rgba(59, 130, 246, 0.10), transparent 70%),
        radial-gradient(50% 45% at 90% 20%, rgba(16, 185, 129, 0.10), transparent 70%),
        radial-gradient(55% 55% at 50% 100%, rgba(59, 130, 246, 0.08), transparent 70%),
        linear-gradient(180deg, #f8fafc 0%, #eef3fb 100%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image:
        linear-gradient(rgba(15, 23, 42, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(15, 23, 42, 0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, #000 40%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, #000 40%, transparent 100%);
      pointer-events: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
    }

    .container {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 var(--space-5);
    }

    .container--narrow {
      max-width: var(--max-width-narrow);
    }

    /* Typography */
    h1, h2, h3, h4 {
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--slate-900);
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      font-family: var(--font-display);
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--secondary);
      margin-bottom: var(--space-4);
    }

    .eyebrow::before {
      content: "";
      width: 28px;
      height: 2px;
      background: linear-gradient(90deg, var(--secondary), transparent);
      border-radius: var(--radius-full);
    }

    .section-title {
      font-size: clamp(2rem, 4.5vw, 3rem);
      margin-bottom: var(--space-4);
    }

    .section-subtitle {
      font-size: clamp(1.05rem, 2vw, 1.2rem);
      color: var(--slate-500);
      max-width: 640px;
      margin: 0 auto;
    }

    .gradient-text {
      background: linear-gradient(120deg, var(--secondary) 0%, var(--accent) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1rem;
      padding: 0.9rem 1.75rem;
      border-radius: var(--radius-full);
      transition: transform 0.3s var(--ease-spring), box-shadow 0.3s var(--ease-out), background 0.3s var(--ease-out);
      will-change: transform;
      white-space: nowrap;
    }

    .btn--primary {
      background: linear-gradient(120deg, var(--secondary) 0%, var(--secondary-dark) 100%);
      color: var(--white);
      box-shadow: var(--shadow-md), 0 10px 24px -8px rgba(59, 130, 246, 0.5);
    }

    .btn--primary:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: var(--shadow-glow);
    }

    .btn--primary:active {
      transform: translateY(-1px) scale(0.99);
    }

    .btn--ghost {
      background: rgba(255, 255, 255, 0.6);
      color: var(--slate-700);
      border: 1px solid var(--slate-200);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .btn--ghost:hover {
      transform: translateY(-3px);
      border-color: var(--secondary);
      color: var(--secondary);
      box-shadow: var(--shadow-md);
    }

    .btn--accent {
      background: linear-gradient(120deg, var(--accent) 0%, var(--accent-dark) 100%);
      color: var(--white);
      box-shadow: var(--shadow-md), 0 10px 24px -8px rgba(16, 185, 129, 0.5);
    }

    .btn--accent:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 0 0 1px rgba(16, 185, 129, 0.15), 0 20px 50px -12px rgba(16, 185, 129, 0.4);
    }

    .btn--lg {
      padding: 1.1rem 2.25rem;
      font-size: 1.05rem;
    }

    .btn__icon {
      width: 1.1em;
      height: 1.1em;
    }

    /* Navigation */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: var(--nav-height);
      display: flex;
      align-items: center;
      transition: background 0.4s var(--ease-out), box-shadow 0.4s var(--ease-out), border-color 0.4s var(--ease-out), height 0.4s var(--ease-out);
      border-bottom: 1px solid transparent;
    }

    .nav.is-scrolled {
      height: 64px;
      background: rgba(248, 250, 252, 0.72);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border-bottom: 1px solid rgba(15, 23, 42, 0.06);
      box-shadow: 0 4px 24px -12px rgba(15, 23, 42, 0.12);
    }

    .nav__inner {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 var(--space-5);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-5);
    }

    .nav__brand {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--slate-900);
      letter-spacing: -0.02em;
    }

    .nav__logo {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      background: linear-gradient(140deg, var(--slate-900) 0%, #1e293b 100%);
      display: grid;
      place-items: center;
      box-shadow: var(--shadow-md);
      flex-shrink: 0;
    }

    .nav__logo svg {
      width: 24px;
      height: 24px;
    }

    .nav__links {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      list-style: none;
    }

    .nav__link {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--slate-600);
      padding: 0.5rem 0.9rem;
      border-radius: var(--radius-full);
      transition: color 0.25s var(--ease-out), background 0.25s var(--ease-out);
    }

    .nav__link:hover {
      color: var(--slate-900);
      background: rgba(15, 23, 42, 0.05);
    }

    .nav__cta {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 0.92rem;
      padding: 0.6rem 1.25rem;
      border-radius: var(--radius-full);
      background: linear-gradient(120deg, var(--secondary) 0%, var(--secondary-dark) 100%);
      color: var(--white);
      box-shadow: 0 6px 16px -6px rgba(59, 130, 246, 0.5);
      transition: transform 0.3s var(--ease-spring), box-shadow 0.3s var(--ease-out);
    }

    .nav__cta:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: var(--shadow-glow);
    }

    .nav__toggle {
      display: none;
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid var(--slate-200);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 5px;
    }

    .nav__toggle span {
      display: block;
      width: 20px;
      height: 2px;
      background: var(--slate-800);
      border-radius: var(--radius-full);
      transition: transform 0.3s var(--ease-out), opacity 0.3s var(--ease-out);
    }

    .nav__toggle.is-open span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }
    .nav__toggle.is-open span:nth-child(2) {
      opacity: 0;
    }
    .nav__toggle.is-open span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    .nav__mobile {
      position: fixed;
      top: var(--nav-height);
      left: 0;
      right: 0;
      z-index: 99;
      background: rgba(248, 250, 252, 0.96);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border-bottom: 1px solid rgba(15, 23, 42, 0.06);
      box-shadow: 0 20px 40px -20px rgba(15, 23, 42, 0.2);
      padding: var(--space-4) var(--space-5) var(--space-6);
      transform: translateY(-12px);
      opacity: 0;
      visibility: hidden;
      transition: transform 0.35s var(--ease-out), opacity 0.35s var(--ease-out), visibility 0.35s;
    }

    .nav__mobile.is-open {
      transform: translateY(0);
      opacity: 1;
      visibility: visible;
    }

    .nav__mobile-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
    }

    .nav__mobile-link {
      display: block;
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--slate-700);
      padding: 0.85rem var(--space-3);
      border-radius: var(--radius-md);
      transition: background 0.25s var(--ease-out), color 0.25s var(--ease-out);
    }

    .nav__mobile-link:hover {
      background: rgba(15, 23, 42, 0.05);
      color: var(--slate-900);
    }

    .nav__mobile .btn {
      width: 100%;
      margin-top: var(--space-3);
    }

    /* Hero */
    .hero {
      position: relative;
      padding: calc(var(--nav-height) + var(--space-10)) 0 var(--space-11);
      overflow: hidden;
    }

    .hero__glow {
      position: absolute;
      top: -10%;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.18), transparent 65%);
      filter: blur(20px);
      z-index: 0;
      animation: pulseGlow 8s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.7; transform: translateX(-50%) scale(1); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.08); }
    }

    .hero__inner {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-9);
      align-items: center;
    }

    .hero__content {
      max-width: 560px;
    }

    .hero__badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: 0.5rem 1rem;
      border-radius: var(--radius-full);
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      color: var(--accent-dark);
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: var(--space-5);
    }

    .hero__badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2);
      animation: dotPulse 2s ease-in-out infinite;
    }

    @keyframes dotPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
      50% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
    }

    .hero__title {
      font-size: clamp(2.5rem, 6vw, 4rem);
      margin-bottom: var(--space-5);
      letter-spacing: -0.03em;
    }

    .hero__sub {
      font-size: clamp(1.05rem, 2vw, 1.2rem);
      color: var(--slate-500);
      margin-bottom: var(--space-7);
      max-width: 480px;
    }

    .hero__actions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-3);
      margin-bottom: var(--space-7);
    }

    .hero__trust {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-4) var(--space-5);
      font-size: 0.9rem;
      color: var(--slate-500);
    }

    .hero__trust span {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
    }

    .hero__trust svg {
      width: 18px;
      height: 18px;
      color: var(--accent);
      flex-shrink: 0;
    }

    /* Chat mockup */
    .hero__visual {
      position: relative;
      display: flex;
      justify-content: center;
    }

    .chat-mockup {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl), 0 0 0 1px rgba(15, 23, 42, 0.03);
      overflow: hidden;
      animation: floatY 6s ease-in-out infinite;
    }

    @keyframes floatY {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-16px); }
    }

    .chat-mockup__head {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-4) var(--space-5);
      border-bottom: 1px solid rgba(15, 23, 42, 0.06);
      background: rgba(255, 255, 255, 0.5);
    }

    .chat-mockup__avatar {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      background: linear-gradient(140deg, var(--slate-900), #1e293b);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .chat-mockup__avatar svg {
      width: 22px;
      height: 22px;
    }

    .chat-mockup__meta {
      flex: 1;
    }

    .chat-mockup__name {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--slate-900);
    }

    .chat-mockup__status {
      font-size: 0.75rem;
      color: var(--accent-dark);
      display: flex;
      align-items: center;
      gap: var(--space-1);
    }

    .chat-mockup__status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
    }

    .chat-mockup__lock {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      background: rgba(16, 185, 129, 0.12);
      display: grid;
      place-items: center;
      color: var(--accent-dark);
    }

    .chat-mockup__lock svg {
      width: 18px;
      height: 18px;
    }

    .chat-mockup__body {
      padding: var(--space-5);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
      min-height: 260px;
    }

    .msg {
      max-width: 82%;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-lg);
      font-size: 0.9rem;
      line-height: 1.5;
      opacity: 0;
      transform: translateY(12px);
      animation: msgIn 0.5s var(--ease-out) forwards;
    }

    @keyframes msgIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .msg--user {
      align-self: flex-end;
      background: linear-gradient(120deg, var(--secondary) 0%, var(--secondary-dark) 100%);
      color: var(--white);
      border-bottom-right-radius: 4px;
      animation-delay: 0.4s;
    }

    .msg--ai {
      align-self: flex-start;
      background: rgba(15, 23, 42, 0.05);
      color: var(--slate-700);
      border-bottom-left-radius: 4px;
      animation-delay: 1.1s;
    }

    .msg--ai-2 {
      align-self: flex-start;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: var(--slate-700);
      border-bottom-left-radius: 4px;
      animation-delay: 1.9s;
      font-size: 0.82rem;
    }

    .chat-mockup__input {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-4) var(--space-5);
      border-top: 1px solid rgba(15, 23, 42, 0.06);
      background: rgba(255, 255, 255, 0.5);
    }

    .chat-mockup__input-field {
      flex: 1;
      padding: 0.6rem 1rem;
      border-radius: var(--radius-full);
      background: rgba(15, 23, 42, 0.04);
      border: 1px solid rgba(15, 23, 42, 0.06);
      color: var(--slate-400);
      font-size: 0.85rem;
    }

    .chat-mockup__send {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(120deg, var(--secondary), var(--secondary-dark));
      color: var(--white);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .chat-mockup__send svg {
      width: 18px;
      height: 18px;
    }

    /* Floating chips around chat */
    .float-chip {
      position: absolute;
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: 0.5rem 0.9rem;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow-lg);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--slate-700);
      z-index: 2;
    }

    .float-chip svg {
      width: 16px;
      height: 16px;
    }

    .float-chip--1 {
      top: 8%;
      left: -6%;
      animation: floatY 7s ease-in-out infinite;
    }
    .float-chip--1 svg { color: var(--accent); }

    .float-chip--2 {
      bottom: 12%;
      right: -4%;
      animation: floatY 8s ease-in-out infinite reverse;
    }
    .float-chip--2 svg { color: var(--secondary); }

    /* Section base */
    .section {
      padding: var(--space-11) 0;
      position: relative;
    }

    .section__head {
      text-align: center;
      max-width: 720px;
      margin: 0 auto var(--space-9);
    }

    .section__head .eyebrow {
      justify-content: center;
    }

    /* Why No Data */
    .why {
      background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.4), transparent);
    }

    .why__grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-5);
    }

    .why-card {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius-xl);
      padding: var(--space-7);
      box-shadow: var(--shadow-md);
      transition: transform 0.4s var(--ease-out), box-shadow 0.4s var(--ease-out), border-color 0.4s var(--ease-out);
    }

    .why-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-xl);
      border-color: rgba(59, 130, 246, 0.3);
    }

    .why-card__icon {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-lg);
      display: grid;
      place-items: center;
      margin-bottom: var(--space-5);
      background: linear-gradient(140deg, rgba(59, 130, 246, 0.12), rgba(16, 185, 129, 0.12));
      color: var(--secondary);
    }

    .why-card__icon svg {
      width: 28px;
      height: 28px;
    }

    .why-card:nth-child(2) .why-card__icon { color: var(--accent); }

    .why-card h3 {
      font-size: 1.3rem;
      margin-bottom: var(--space-3);
    }

    .why-card p {
      color: var(--slate-500);
      font-size: 0.98rem;
    }

    /* Process */
    .process__flow {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-5);
      position: relative;
    }

    .process__line {
      position: absolute;
      top: 44px;
      left: 16%;
      right: 16%;
      height: 2px;
      background: linear-gradient(90deg, var(--secondary), var(--accent));
      opacity: 0.3;
      z-index: 0;
    }

    .step {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 0 var(--space-3);
    }

    .step__num {
      width: 88px;
      height: 88px;
      margin: 0 auto var(--space-5);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow-lg);
      display: grid;
      place-items: center;
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 700;
      color: var(--secondary);
      transition: transform 0.4s var(--ease-spring);
    }

    .step:hover .step__num {
      transform: scale(1.08);
    }

    .step h3 {
      font-size: 1.2rem;
      margin-bottom: var(--space-2);
    }

    .step p {
      color: var(--slate-500);
      font-size: 0.95rem;
      max-width: 260px;
      margin: 0 auto;
    }

    .process__note {
      text-align: center;
      margin-top: var(--space-8);
      font-family: var(--font-display);
      font-weight: 600;
      color: var(--accent-dark);
      font-size: 1.05rem;
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
    }

    .process__note-wrap {
      text-align: center;
    }

    /* Capabilities */
    .caps {
      background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.4), transparent);
    }

    .caps__grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-5);
    }

    .cap-card {
      position: relative;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius-xl);
      padding: var(--space-6);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      transition: transform 0.4s var(--ease-out), box-shadow 0.4s var(--ease-out);
    }

    .cap-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.06), transparent 60%);
      opacity: 0;
      transition: opacity 0.4s var(--ease-out);
    }

    .cap-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-xl);
    }

    .cap-card:hover::before {
      opacity: 1;
    }

    .cap-card__icon {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-md);
      display: grid;
      place-items: center;
      margin-bottom: var(--space-4);
      background: var(--slate-900);
      color: var(--white);
      position: relative;
      z-index: 1;
    }

    .cap-card__icon svg {
      width: 26px;
      height: 26px;
    }

    .cap-card h3 {
      font-size: 1.15rem;
      margin-bottom: var(--space-2);
      position: relative;
      z-index: 1;
    }

    .cap-card p {
      color: var(--slate-500);
      font-size: 0.92rem;
      position: relative;
      z-index: 1;
    }

    /* Privacy Promise */
    .promise {
      position: relative;
      overflow: hidden;
    }

    .promise__inner {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-9);
      align-items: center;
      background: linear-gradient(140deg, var(--slate-900) 0%, #1e293b 100%);
      border-radius: var(--radius-2xl);
      padding: var(--space-9);
      color: var(--white);
      box-shadow: var(--shadow-xl);
      position: relative;
      overflow: hidden;
    }

    .promise__inner::before {
      content: "";
      position: absolute;
      top: -30%;
      right: -10%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.3), transparent 70%);
      filter: blur(30px);
    }

    .promise__inner::after {
      content: "";
      position: absolute;
      bottom: -30%;
      left: -10%;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.25), transparent 70%);
      filter: blur(30px);
    }

    .promise__text {
      position: relative;
      z-index: 1;
    }

    .promise__text .eyebrow {
      color: var(--accent);
    }

    .promise__text .eyebrow::before {
      background: linear-gradient(90deg, var(--accent), transparent);
    }

    .promise__text h2 {
      color: var(--white);
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      margin-bottom: var(--space-5);
    }

    .promise__text p {
      color: rgba(255, 255, 255, 0.75);
      font-size: 1.05rem;
      margin-bottom: var(--space-6);
    }

    .promise__list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    .promise__list li {
      display: flex;
      align-items: flex-start;
      gap: var(--space-3);
      font-size: 0.98rem;
      color: rgba(255, 255, 255, 0.9);
    }

    .promise__list .check {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.4);
      display: grid;
      place-items: center;
      color: var(--accent);
      flex-shrink: 0;
      margin-top: 2px;
    }

    .promise__list .check svg {
      width: 15px;
      height: 15px;
    }

    .promise__visual {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .shield {
      width: 100%;
      max-width: 320px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.15), transparent 70%);
      display: grid;
      place-items: center;
      position: relative;
    }

    .shield::before {
      content: "";
      position: absolute;
      inset: 12%;
      border-radius: 50%;
      border: 1px dashed rgba(255, 255, 255, 0.15);
      animation: spin 30s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .shield__core {
      width: 60%;
      height: 60%;
      border-radius: 50%;
      background: linear-gradient(140deg, rgba(59, 130, 246, 0.25), rgba(16, 185, 129, 0.25));
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: grid;
      place-items: center;
      box-shadow: 0 0 60px rgba(59, 130, 246, 0.3);
    }

    .shield__core svg {
      width: 45%;
      height: 45%;
      color: var(--white);
    }

    /* Testimonials */
    .trust {
      background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.4), transparent);
    }

    .trust__grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-5);
    }

    .quote {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius-xl);
      padding: var(--space-6);
      box-shadow: var(--shadow-md);
      transition: transform 0.4s var(--ease-out), box-shadow 0.4s var(--ease-out);
      display: flex;
      flex-direction: column;
    }

    .quote:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-xl);
    }

    .quote__mark {
      font-family: var(--font-display);
      font-size: 3rem;
      line-height: 0.5;
      color: var(--secondary);
      opacity: 0.3;
      margin-bottom: var(--space-3);
    }

    .quote__stars {
      display: flex;
      gap: 3px;
      margin-bottom: var(--space-4);
      color: #f59e0b;
    }

    .quote__stars svg {
      width: 18px;
      height: 18px;
    }

    .quote__text {
      font-size: 1.02rem;
      color: var(--slate-700);
      margin-bottom: var(--space-5);
      flex: 1;
    }

    .quote__author {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .quote__avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--white);
      font-size: 1rem;
      flex-shrink: 0;
    }

    .quote__avatar--1 { background: linear-gradient(140deg, var(--secondary), var(--secondary-dark)); }
    .quote__avatar--2 { background: linear-gradient(140deg, var(--accent), var(--accent-dark)); }
    .quote__avatar--3 { background: linear-gradient(140deg, #8b5cf6, #6d28d9); }

    .quote__name {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--slate-900);
    }

    .quote__role {
      font-size: 0.82rem;
      color: var(--slate-500);
    }

    /* FAQ */
    .faq__list {
      max-width: var(--max-width-narrow);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    .faq-item {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: border-color 0.3s var(--ease-out), box-shadow 0.3s var(--ease-out);
    }

    .faq-item.is-open {
      border-color: rgba(59, 130, 246, 0.3);
      box-shadow: var(--shadow-md);
    }

    .faq-item__q {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      padding: var(--space-5);
      text-align: left;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.05rem;
      color: var(--slate-900);
    }

    .faq-item__icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(59, 130, 246, 0.1);
      color: var(--secondary);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      transition: transform 0.35s var(--ease-out), background 0.35s var(--ease-out);
    }

    .faq-item__icon svg {
      width: 18px;
      height: 18px;
    }

    .faq-item.is-open .faq-item__icon {
      transform: rotate(180deg);
      background: var(--secondary);
      color: var(--white);
    }

    .faq-item__a {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s var(--ease-out);
    }

    .faq-item__a-inner {
      padding: 0 var(--space-5) var(--space-5);
      color: var(--slate-500);
      font-size: 0.98rem;
      line-height: 1.65;
    }

    /* CTA */
    .cta {
      position: relative;
      overflow: hidden;
    }

    .cta__box {
      background: linear-gradient(140deg, var(--slate-900) 0%, #1e293b 100%);
      border-radius: var(--radius-2xl);
      padding: var(--space-10);
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-xl);
    }

    .cta__box::before {
      content: "";
      position: absolute;
      top: -40%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.25), transparent 70%);
      filter: blur(20px);
    }

    .cta__box > * {
      position: relative;
      z-index: 1;
    }

    .cta__box .eyebrow {
      color: var(--accent);
      justify-content: center;
    }

    .cta__box .eyebrow::before {
      background
